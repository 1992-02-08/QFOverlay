name: Build QFSpeed .tipa

on:
  workflow_dispatch:        # 手动在 Actions 页点 Run workflow 即可触发
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: macos-latest   # 必须 macOS runner：本地沙箱无 SDK，真编译在 GitHub 上跑
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid + Pillow（图标生成用）
        run: |
          brew install ldid
          python3 -m pip install --user Pillow --break-system-packages || python3 -m pip install --user Pillow || echo "Pillow 安装失败，图标将跳过（不影响功能）"

      - name: Build .tipa
        run: |
          cd QFSpeedApp
          chmod +x build-tipa.sh
          bash build-tipa.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QFSpeed-tipa
          path: "QFSpeedApp/QFSpeed-*.tipa"
          if-no-files-found: error
